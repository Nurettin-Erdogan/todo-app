<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1>To-Do List</h1>
        <p class="subtitle">Basit ve kullanıcı dostu görev yöneticisi</p>
      </div>
    </header>

    <main class="app">
      <section class="todo-app">
        <div class="input-area">
          <input type="text" id="taskInput" placeholder="Yeni görev yazın ve Enter'a basın..." aria-label="Yeni görev" />
          <input type="date" id="taskDate" aria-label="Son tarih" />
          <input type="text" id="taskTags" placeholder="Etiketler (virgülle ayır)" aria-label="Etiketler" />
          <select id="taskPriority" aria-label="Öncelik">
            <option value="low">Düşük</option>
            <option value="medium" selected>Orta</option>
            <option value="high">Yüksek</option>
          </select>
          <button id="addBtn" aria-label="Görev ekle">Ekle</button>
          <button id="exportBtn" aria-label="Dışa Aktar">Dışa Aktar</button>
          <button id="importBtn" aria-label="İçe Aktar">İçe Aktar</button>
          <input type="file" id="importFile" accept=".json" style="display:none" />
        </div>

        <div class="controls">
          <div class="stats"><span id="remainingCount">0</span> görev kaldı</div>

          <div class="filters" role="tablist" aria-label="Filtreler">
            <button class="filter-btn active" id="filterAll">Tümü</button>
            <button class="filter-btn" id="filterActive">Aktif</button>
            <button class="filter-btn" id="filterCompleted">Tamamlanan</button>
          </div>

          <div class="tag-filters" id="tagFilters" aria-label="Etiket filtreleri"></div>

          <div class="saved-filters">
            <input id="savedFilterName" placeholder="Filtre adı" />
            <button id="saveFilterBtn">Filtreyi Kaydet</button>
            <div id="savedFiltersList" class="saved-filters-list"></div>
          </div>

          <div class="actions">
            <button id="clearCompletedBtn">Tamamlananları Temizle</button>
            <button id="shareBtn">Paylaş</button>
          </div>
        </div>

        <ul id="taskList" class="task-list" aria-live="polite"></ul>
      </section>

      <!-- About section removed per user request -->
    </main>

    <footer class="footer">
      <small>To-Do List — Açık kaynak, basit ve kullanışlı.</small>
    </footer>
  </div>

    <div id="snackbar" class="snackbar" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
