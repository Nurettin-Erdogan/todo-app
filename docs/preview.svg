<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Görev Listesi uygulama önizlemesi</title>
  <desc id="desc">Görev ekleme formu, ilerleme göstergesi ve görev kartlarını gösteren stilize arayüz görseli.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0f172a" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="650" rx="42" fill="url(#background)"/>
  <circle cx="1100" cy="100" r="170" fill="#fbbf24" opacity=".16"/><circle cx="100" cy="580" r="200" fill="#a5f3fc" opacity=".14"/>
  <g filter="url(#shadow)">
    <rect x="90" y="54" width="1020" height="542" rx="30" fill="#f8fafc"/>
    <rect x="90" y="54" width="1020" height="72" rx="30" fill="#fff"/><rect x="90" y="96" width="1020" height="30" fill="#fff"/>
    <circle cx="132" cy="88" r="12" fill="#fb7185"/><circle cx="166" cy="88" r="12" fill="#fbbf24"/><circle cx="200" cy="88" r="12" fill="#34d399"/>
    <text x="246" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Görev Listesi</text>
    <text x="142" y="174" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Bugünün odağı</text>
    <text x="142" y="204" fill="#64748b" font-family="Arial, sans-serif" font-size="17">3 görevden 2'si tamamlandı</text>
    <rect x="142" y="226" width="600" height="14" rx="7" fill="#e2e8f0"/><rect x="142" y="226" width="400" height="14" rx="7" fill="#4f46e5"/>
    <rect x="142" y="274" width="630" height="58" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="166" y="311" fill="#64748b" font-family="Arial, sans-serif" font-size="19">Yeni görev ekle...</text>
    <rect x="790" y="274" width="154" height="58" rx="16" fill="#4f46e5"/><text x="820" y="311" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">+ Ekle</text>
    <g font-family="Arial, sans-serif">
      <rect x="142" y="366" width="900" height="64" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
      <circle cx="174" cy="398" r="13" fill="#4f46e5"/><text x="169" y="405" fill="#fff" font-size="15">✓</text>
      <text x="208" y="404" fill="#475569" font-size="20" text-decoration="line-through">Sunum taslağını tamamla</text><text x="876" y="404" fill="#64748b" font-size="16">Bugün</text>
      <rect x="142" y="446" width="900" height="64" rx="16" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
      <circle cx="174" cy="478" r="13" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <text x="208" y="484" fill="#0f172a" font-size="20" font-weight="700">Haftalık planı gözden geçir</text><text x="876" y="484" fill="#f97316" font-size="16">Yüksek</text>
    </g>
  </g>
</svg>
